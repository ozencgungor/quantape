name: docs

on:
  push:
    paths: ["docs/**", "include/**", "README.md"]
  pull_request:
    paths: ["docs/**", "include/**", "README.md"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doxygen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      # Mirrors the CMake build target `docs` (CMakeLists.txt): same Doxyfile,
      # same working directory. Invoked directly here so a docs-only job does
      # not configure the project (which would fetch all third-party deps).
      # Doxyfile has OUTPUT_DIRECTORY = docs and INPUT = include/quantape,
      # so it must be run from the repository root.
      - run: doxygen docs/Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/html
