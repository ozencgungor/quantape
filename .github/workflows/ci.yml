name: ci

# Push runs are the cheap main-branch smoke (fast tier only); the full suite
# runs on pull requests. Feature-branch pushes do not trigger this at all —
# their PR event does, so each change runs once.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Main pushes smoke only the optimized (Release) builds; the Debug jobs
      # are PR-only, where branch protection requires the full four-job matrix.
      # (Dropping them from the matrix avoids even scheduling macOS Debug jobs.)
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-14","build_type":"Debug"},{"os":"macos-14","build_type":"Release"},{"os":"ubuntu-24.04","build_type":"Debug"},{"os":"ubuntu-24.04","build_type":"Release"}]') || fromJSON('[{"os":"macos-14","build_type":"Release"},{"os":"ubuntu-24.04","build_type":"Release"}]') }}
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.build_type }}
          max-size: 500M

      # third-party/ and FetchContent downloads dominate a cold build; cache
      # both, keyed on the dependency wiring so pin changes invalidate.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            third-party
            build-ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'repo_tools/fetch_third_party.sh') }}

      - name: Fetch pinned dependencies (Eigen, Stan Math)
        run: repo_tools/fetch_third_party.sh

      - name: Configure
        run: >
          cmake -S . -B build-ci
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DQUANTAPE_NATIVE_ARCH=OFF
          -DQUANTAPE_BUILD_BENCHMARKS=OFF
          -DQUANTAPE_BUILD_EXAMPLES=ON
          -DQUANTAPE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build-ci -j 4

      # Fast tier first: a cheap failure aborts the job (fail-fast) before the
      # full suite. It also is the whole test step for main pushes; the full
      # 520-case run only happens on PRs and uploads one JUnit aggregate per
      # matrix job (--timeout 1800 covers the 500s-class stress cases).
      - name: Test (fast tier)
        run: ctest --test-dir build-ci -L fast -j 4 --output-on-failure

      - name: Test (full suite)
        if: github.event_name == 'pull_request'
        run: >
          ctest --test-dir build-ci -j 4 --output-on-failure --timeout 1800
          --output-junit junit-${{ matrix.os }}-${{ matrix.build_type }}.xml

      - name: Upload JUnit results
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-${{ matrix.build_type }}
          path: build-ci/junit-${{ matrix.os }}-${{ matrix.build_type }}.xml
          if-no-files-found: ignore
