name: sanitizers

on:
  push:
  pull_request:

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    runs-on: ubuntu-24.04
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      SAN_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g
      # oneTBB 2021.9 computes stack bounds via pthread_getattr_np(), which
      # reports the ASan fake stack and trips its internal assertion on
      # Linux/GCC ("stack size must be positive", UXL oneTBB #1726, fixed
      # upstream after our pin). Disabling use-after-return detection keeps
      # the real stack bounds. Job-level so build-time gtest discovery (which
      # executes each test binary with --gtest_list_tests) sees it too.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:detect_stack_use_after_return=0
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizers-${{ github.ref_name }}
          max-size: 300M

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            third-party
            build-san/_deps
          key: deps-sanitizers-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'repo_tools/fetch_third_party.sh') }}

      - name: Fetch pinned dependencies (Eigen, Stan Math)
        run: repo_tools/fetch_third_party.sh

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DQUANTAPE_BUILD_BENCHMARKS=OFF
          -DQUANTAPE_BUILD_TOOLS=OFF
          -DQUANTAPE_BUILD_EXAMPLES=OFF
          "-DCMAKE_CXX_FLAGS=${SAN_FLAGS}"
          "-DCMAKE_C_FLAGS=${SAN_FLAGS}"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j 4

      # Leak checking is off for now: TBB/quill keep intentional process-lifetime
      # allocations. UBSan reports but does not abort (third-party deps are
      # compiled with the same sanitizer flags). No death tests exist any more
      # (the legacy _Exit gate was retired, D9), so no exclusions are needed.
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: >
          ctest --test-dir build-san -j 2 --output-on-failure --timeout 1800
          --output-junit sanitizers-junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-asan-ubsan
          path: build-san/sanitizers-junit.xml
          if-no-files-found: ignore
