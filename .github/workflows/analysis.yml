name: analysis

# clang-tidy is a PR-only gate (required check); manual dispatch for reruns.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for --changed (merge-base with the target ref)

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            third-party
            build-ci/_deps
            build-lightape/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'repo_tools/fetch_third_party.sh', 'lightape/CMakeLists.txt') }}

      - name: Fetch pinned dependencies (Eigen, Stan Math)
        run: repo_tools/fetch_third_party.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin the same clang-tidy as local dev (the PyPI wheel, 22.1.8): the
      # allowlists in repo_tools/check_tidy.sh are verified against it and
      # distro clang-tidy versions drift.
      - name: Install clang-tidy
        run: pip install clang-tidy==22.1.8

      - name: Configure (compile database only)
        run: >
          cmake -S . -B build-ci
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DQUANTAPE_BUILD_BENCHMARKS=OFF
          -DQUANTAPE_BUILD_TOOLS=OFF
          -DQUANTAPE_BUILD_EXAMPLES=OFF

      # lightape is standalone and header-only: its own database (tests +
      # benchmarks; third-party/eigen from the fetch above) is what
      # repo_tools/check_tidy.sh analyses it with. libm keeps the configure
      # independent of the SLEEF download.
      - name: Configure lightape (compile database only)
        run: >
          cmake -S lightape -B build-lightape
          -DCMAKE_BUILD_TYPE=Release
          -DLIGHTAPE_BUILD_TESTS=ON
          -DLIGHTAPE_BUILD_BENCHMARKS=ON
          -DLIGHTAPE_VECTOR_MATH=libm
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Allowlist in repo_tools/check_tidy.sh grows module by module; it exits
      # 0 when nothing allowlisted changed. The googletest include dirs are
      # marked SYSTEM in cmake/Dependencies.cmake (quantape_mark_system), so
      # --warnings-as-errors never trips on third-party test-framework headers.
      - name: clang-tidy (allowlisted modules)
        env:
          BUILD_DIR: build-ci
          LIGHTAPE_BUILD_DIR: build-lightape
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            repo_tools/check_tidy.sh --changed "${{ github.event.pull_request.base.sha }}"
          else
            repo_tools/check_tidy.sh
          fi
